<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>폴리 인사관리 시스템</title>
<style>
/* ===== 디자인 토큰 — 일관된 컬러 팔레트 ===== */
:root{
  /* 브랜드 */
  --brand:#1a3a5c;
  --brand-light:#2c5282;
  /* 시맨틱 컬러 */
  --accent-primary:#1565C0;   /* 파랑 — 주요 정보·집계·기본급 */
  --accent-success:#2E7D32;   /* 초록 — 재직·정상·실지급 */
  --accent-warning:#F57F17;   /* 주황 — 경고·편차·주의 */
  --accent-danger:#C62828;    /* 빨강 — 퇴사·위험·오류 */
  --accent-purple:#6A1B9A;    /* 보라 — 이력·이벤트·특수 */
  --accent-teal:#00838F;      /* 청록 — 조직·관계 */
  /* 중성 */
  --bg:#f3f4f6;
  --bg-card:#fff;
  --bg-muted:#f8f9fa;
  --bg-muted2:#f5f5f5;
  --border:#e0e0e0;
  --border-light:#f0f0f0;
  --text:#1a1a1a;
  --text-muted:#666;
  --text-faint:#888;
  --text-very-faint:#aaa;
  /* v52: 디자인 토큰 */
  --card-bg:#ffffff;
  --card-border:#ECECEE;
  --card-radius:14px;
  --card-shadow:0 1px 2px rgba(20,20,40,.025), 0 4px 14px rgba(20,20,40,.04);
  --card-shadow-hover:0 2px 4px rgba(20,20,40,.035), 0 8px 24px rgba(20,20,40,.06);
  --divider:#F2F2F4;
  --row-hover:#FAFBFD;
  --row-alt:#FCFCFD;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:12px;display:flex;flex-direction:column;height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* v52: 공통 카드 시스템 */
.tcard{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:14px 16px;display:flex;flex-direction:column;transition:box-shadow .25s ease,transform .25s ease}
.tcard:hover{box-shadow:var(--card-shadow-hover)}
.tcard-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11.5px;font-weight:800;letter-spacing:-.2px;color:#1a1a1a}
.tcard-head .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px currentColor;opacity:.18}
.tcard-head .dotwrap{flex-shrink:0}
.tcard-head .dotwrap .dot{opacity:1;box-shadow:none}
.tcard-head .meta{font-size:9.5px;color:#9da3ab;font-weight:500;margin-left:auto;letter-spacing:0}
.ttable{width:100%;border-collapse:collapse;font-size:10.5px}
.ttable thead th{padding:6px 10px;text-align:left;font-weight:600;color:#9da3ab;font-size:9px;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--divider);white-space:nowrap}
.ttable thead th.r{text-align:right}.ttable thead th.c{text-align:center}
.ttable tbody td{padding:7px 10px;border-bottom:1px solid var(--divider);font-size:10.5px;color:#26262b}
.ttable tbody td.r{text-align:right}.ttable tbody td.c{text-align:center}
.ttable tbody tr:last-child td{border-bottom:none}
.ttable tbody tr:nth-child(even):not(.sumrow) td{background:#f0f0f0}
.ttable tbody tr:hover:not(.sumrow) td{background:#e3f2fd}
.ttable tbody tr.sumrow td{font-weight:800;background:#FAFBFD;border-top:1px solid #E5E5E8}
.ttable .lbl{font-weight:700;color:#26262b}
.tbar-wrap{display:flex;align-items:center;gap:6px;min-width:90px}
.tbar{flex:1;height:5px;background:#F0F0F2;border-radius:3px;overflow:hidden;position:relative;min-width:30px}
.tbar>div{height:100%;border-radius:3px;transition:width .35s ease}
.tbar-pct{font-size:10px;font-weight:700;min-width:36px;text-align:right;letter-spacing:-.3px}
.chip{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:-.1px;line-height:1.4}
.chip-sm{padding:1px 6px;font-size:9px}

.header{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-light) 100%);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;color:#fff}
.header h1{font-size:15px;font-weight:800;letter-spacing:-.3px}
.header .meta{font-size:9px;opacity:.7;margin-top:1px}
.hdr-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.search-box{padding:6px 12px;border:none;border-radius:8px;font-size:12px;width:200px;outline:none;font-family:inherit;background:rgba(255,255,255,.15);color:#fff}
.search-box::placeholder{color:rgba(255,255,255,.5)}
.search-box:focus{background:rgba(255,255,255,.25)}
.hbtn{padding:5px 12px;border:1px solid rgba(255,255,255,.3);border-radius:8px;font-size:11px;cursor:pointer;background:transparent;color:#fff;font-family:inherit;transition:all .15s}
.hbtn:hover{background:rgba(255,255,255,.15)}
/* [index4 전용] 전 탭 큰 글씨 모드 — 본문 전체 15% 확대 (상하 스크롤 허용) */
#mainContent{zoom:1.15}
.gp-big{}/* 급여(직책별) 개별 확대는 본문 전체 확대로 대체 (이중 확대 방지) */
.sel-banner{background:#E3F2FD;padding:7px 16px;display:none;align-items:center;gap:10px;border-bottom:2px solid #2196F3;font-size:12px}
.sel-banner .hint{color:#2196F3;font-weight:600}
.tabs{display:flex;background:#fff;border-bottom:1px solid #ECECEE;padding:0 16px;overflow-x:auto;flex-shrink:0}
.tab{padding:8px 13px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;color:#888;font-family:inherit;white-space:nowrap;transition:all .15s}
.tab:hover{color:#333}
.tab.on{color:#1a3a5c;border-bottom-color:#1a3a5c;font-weight:700}
.month-bar{display:flex;background:#fff;border-top:2px solid #e0e0e0;padding:0;flex-shrink:0;align-items:center}
.month-arrow{padding:6px 8px;cursor:pointer;background:#fff;border:none;font-size:14px;color:#999;flex-shrink:0}
.month-arrow:hover{color:#333;background:#f5f5f5}
.month-scroll{display:flex;overflow-x:auto;flex:1;gap:4px;padding:4px 6px;-ms-overflow-style:none;scrollbar-width:none}
.month-scroll::-webkit-scrollbar{display:none}
.month-tab{padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #e0e0e0;background:#fff;border-radius:8px;color:#888;font-family:inherit;white-space:nowrap;transition:all .15s;flex-shrink:0;border-bottom:3px solid transparent}
.month-tab:hover{color:#333;border-color:#aaa}
.month-tab.on{color:#fff;background:#1a3a5c;border-color:#1a3a5c;font-weight:700}
.month-tab.hidden{opacity:.35;text-decoration:line-through}
.month-add{padding:6px 12px;border:1px dashed #ccc;border-radius:8px;font-size:11px;cursor:pointer;background:none;color:#999;font-family:inherit;margin-left:4px}
.month-add:hover{border-color:#2196F3;color:#2196F3}
.main{flex:1;overflow-y:auto;padding:10px 14px}
.notif{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none}
.notif.ok{background:#E8F5E9;color:#1B5E20;border:1px solid #A5D6A7}
.notif.info{background:#E3F2FD;color:#0D47A1;border:1px solid #90CAF9}
.notif.warn{background:#FFF3E0;color:#E65100;border:1px solid #FFCC80}
/* 직원 카드 */
.sess-hdr{display:flex;align-items:center;gap:6px;margin:8px 0 6px;padding-bottom:5px;border-bottom:1px solid #ECECEE}
.sess-name{font-size:12px;font-weight:800}
.sess-cnt{font-size:10px;color:#aaa;margin-left:auto}
.cls-scroll{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px}
.emp-card{width:186px;border-radius:9px;overflow:hidden;border:1.5px solid #e0e0e0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:all .2s}
.emp-card.drag-over{border-color:#2196F3!important;background:#E3F2FD;box-shadow:0 0 0 2px #90CAF9}
.emp-card.sel-target{box-shadow:0 0 0 2px #90CAF9;cursor:pointer}
.emp-card.sel-target:hover{box-shadow:0 0 0 3px #2196F3}
.card-move-btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:1px 5px;border-radius:3px;font-size:12px;font-weight:900;line-height:1;color:#fff;opacity:.45;user-select:none;background:none;border:none;font-family:inherit;transition:opacity .1s}
.card-move-btn:hover{opacity:1;background:rgba(255,255,255,.25)}
.card-move-btn:disabled{opacity:.12;cursor:default;pointer-events:none}
.cls-head{padding:7px 9px;color:#fff;cursor:pointer;transition:filter .15s}
.cls-head:hover{filter:brightness(1.1)}
.cls-head h3{font-size:12px;font-weight:800;margin:0}
.cls-top{display:flex;justify-content:space-between;align-items:center}
.cls-info{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:9.5px}
.cls-info-row{display:flex;align-items:center;gap:3px}
.cls-info-row .lbl{opacity:.6;font-size:8.5px;min-width:22px}
.cls-info-row .val{background:rgba(255,255,255,.22);padding:1px 6px;border-radius:3px;font-weight:600;font-size:9.5px}
.cnt-pill{font-size:11px;font-weight:800;background:rgba(255,255,255,.3);padding:1px 7px;border-radius:8px}
.emp-list{overflow:hidden}
.emp-item:nth-child(odd){background:#fafafa}.emp-item:nth-child(even){background:#fff}
.emp-item:hover{background:#f0f4ff!important}
.emp-item{display:flex;align-items:center;gap:3px;padding:2px 6px;border-bottom:1px solid #F2F2F4;font-size:11px;cursor:grab;transition:background .1s;height:22px}
.emp-item.selected{background:#E3F2FD!important;border-left:3px solid #2196F3;padding-left:4px}
.emp-item .name-group{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:baseline;gap:3px;min-width:0}
.emp-num{font-size:8px;color:#bbb;min-width:12px;text-align:right;flex-shrink:0}
.emp-item .ename{font-weight:600;flex-shrink:0;font-size:11px}
.emp-item .esub{font-size:8.5px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grade-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px;white-space:nowrap;border:1px solid;flex-shrink:0}
.emp-empty-row{height:22px;border-bottom:1px solid #f8f8f8}
.add-emp-btn{display:flex;align-items:center;justify-content:center;padding:2px;cursor:pointer;opacity:.5;transition:opacity .15s;font-size:9px;color:#999;border-top:1px dashed #ddd;height:18px}
.add-emp-btn:hover{opacity:1;color:#2196F3}
/* 대기/보류 섹션 */
.pending-section{border-top:2px solid #F9A825;background:#FFFDE7;padding:2px 6px}
.pending-hdr{font-size:8px;font-weight:700;color:#F9A825;margin:1px 0;display:flex;justify-content:space-between;align-items:center}
.pending-item{display:flex;align-items:center;gap:3px;padding:1px 4px;font-size:9px;cursor:pointer;border-bottom:1px solid #FFF9C4;height:18px}
.pending-item:hover{background:#FFF9C4}
.pending-add{text-align:center;padding:1px;font-size:8px;color:#F9A825;cursor:pointer;opacity:.6;height:16px}
.pending-add:hover{opacity:1}
/* 필터 */
.filters{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.fpill{padding:4px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#666;font-size:11px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.fpill.on{font-weight:700;color:#fff}
/* 직원 테이블 */
.emp-table{background:#fff;border-radius:9px;border:1px solid #e0e0e0;overflow:hidden}
.emp-table-head{display:grid;grid-template-columns:28px 1.4fr .7fr .9fr .8fr .7fr .7fr;padding:6px 10px;background:#f5f5f5;border-bottom:1px solid #ECECEE;font-size:10px;font-weight:700;color:#666}
.emp-table-body{max-height:70vh;overflow-y:auto}
.emp-row{display:grid;grid-template-columns:28px 1.4fr .7fr .9fr .8fr .7fr .7fr;padding:4px 10px;border-bottom:1px solid #f8f8f8;font-size:11px;align-items:center;cursor:pointer}
.emp-row:hover{background:#fafafa}
.emp-row:nth-child(odd){background:#fcfcfc}
/* 급여 분석 */
.pay-stat-card{background:#fff;border-radius:10px;padding:12px;border:1px solid #e0e0e0;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:10px}
.pay-stat-card h3{font-size:12px;font-weight:700;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #ECECEE}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.pay-grade-section{border-radius:6px;overflow:hidden}
.pay-grade-hdr{padding:4px 8px;font-size:10px;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center}
.pay-grade-body{background:#fff;border:1px solid #e0e0e0;border-top:0;overflow:hidden}
.pay-row{display:grid;grid-template-columns:24px 1.2fr .8fr .7fr .7fr .7fr .7fr .7fr .7fr;padding:0 4px;border-bottom:1px solid #f5f5f5;font-size:9px;align-items:center;height:22px;cursor:pointer}
.pay-row:nth-child(odd){background:#fafafa}
.pay-row:hover{background:#f0f4ff!important}
.pay-hdr-row{background:#f5f5f5!important;font-weight:700;color:#999;font-size:8px;cursor:default;height:18px}
/* Raw 데이터 표시 (업로드 UI는 제거됨) */
.raw-table-wrap{overflow-x:auto;max-height:420px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:8px}
.raw-table{width:100%;border-collapse:collapse;font-size:10px;white-space:nowrap}
.raw-table th{background:#f5f5f5;color:#555;padding:4px 8px;position:sticky;top:0;z-index:1;font-weight:700;font-size:9px;border-bottom:1px solid #ECECEE}
.raw-table td{padding:3px 8px;border-bottom:1px solid #f8f8f8}
.raw-table tr:hover td{background:#f5f7ff}
/* 입퇴사 */
.inout-pill{padding:5px 16px;border-radius:20px;border:1.5px solid #ddd;background:#fff;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.inout-pill.in-on{background:#4CAF50;color:#fff;border-color:#4CAF50}
.inout-pill.out-on{background:#E53935;color:#fff;border-color:#E53935}
.inout-pill.all-on{background:#1a3a5c;color:#fff;border-color:#1a3a5c}
.inout-table{background:#fff;border-radius:12px;border:1px solid #ECECEE;box-shadow:0 1px 2px rgba(20,20,40,.025),0 4px 14px rgba(20,20,40,.04);overflow:hidden}
.inout-hdr{display:grid;grid-template-columns:70px 50px 80px 1fr .9fr .7fr 1fr;padding:7px 12px;background:#f5f5f5;border-bottom:1px solid #ECECEE;font-size:10px;font-weight:700;color:#666}
.inout-row{display:grid;grid-template-columns:70px 50px 80px 1fr .9fr .7fr 1fr;padding:5px 12px;border-bottom:1px solid #f5f5f5;font-size:11px;align-items:center;cursor:pointer}
.inout-row:hover{background:#fafafa}
.inout-row:nth-child(odd){background:#fcfcfc}
.inout-type{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;text-align:center}
.inout-in{background:#E8F5E9;color:#2E7D32}
.inout-out{background:#FFEBEE;color:#C62828}
.inout-add{display:flex;justify-content:center;padding:7px;cursor:pointer;color:#aaa;font-size:12px;border-top:1px dashed #eee}
.inout-add:hover{color:#2196F3}
/* 로그 */
.log-cal{background:#fff;border-radius:12px;border:1px solid #e0e0e0;overflow:hidden}
.log-cal-head{display:flex;align-items:center;padding:10px 14px;background:#f5f5f5;border-bottom:1px solid #ECECEE;font-size:13px;font-weight:700;color:#555}
.log-day{border-bottom:1px solid #F2F2F4}
.log-day-hdr{padding:5px 14px;background:#fafafa;font-size:11px;font-weight:700;color:#888;display:flex;justify-content:space-between}
.log-entry{display:grid;grid-template-columns:55px 50px 1fr 1fr .6fr;padding:4px 14px;font-size:11px;align-items:center;border-bottom:1px solid #f8f8f8}
.log-entry:hover{background:#fafafa}
.log-entry .le-time{color:#aaa;font-size:10px}
.log-entry .le-type{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;text-align:center}
.log-entry .le-name{font-weight:600}
.log-entry .le-from{color:#E53935;font-size:11px}
.log-entry .le-to{color:#2E7D32;font-size:11px}
.log-empty{background:#fff;border-radius:10px;padding:40px;text-align:center;color:#aaa;font-size:13px;border:1px solid #e0e0e0}
/* 설정 탭 */
.cfg-layout{display:grid;grid-template-columns:190px 1fr;gap:0;height:calc(100vh - 130px);background:#fff;border-radius:12px;border:1px solid #ECECEE;box-shadow:0 1px 2px rgba(20,20,40,.025),0 4px 14px rgba(20,20,40,.04);overflow:hidden}
.cfg-nav{background:#f8f9fa;border-right:1px solid #e0e0e0;padding:12px 0}
.cfg-nav-item{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:12px;font-weight:500;color:#666;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.cfg-nav-item:hover{background:#f0f0f0;color:#333}
.cfg-nav-item.on{background:#EEF2FF;color:#1a3a5c;border-left-color:#1a3a5c;font-weight:700}
.cfg-body{padding:20px 22px;overflow-y:auto}
.cfg-section-title{font-size:13px;font-weight:800;color:#1a3a5c;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #ECECEE;display:flex;align-items:center;gap:6px}
.cfg-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:1px solid #e8e8e8;background:#fff;margin-bottom:6px}
.cfg-row .cfg-name{font-size:13px;font-weight:600;flex:1}
.cfg-row .cfg-sub{font-size:11px;color:#aaa}
.cfg-row .cfg-actions{display:flex;gap:4px;flex-shrink:0}
.cfg-btn{padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;border:1px solid #ddd;background:#fff;transition:all .15s;font-weight:500}
.cfg-btn:hover{background:#f5f5f5}
.cfg-btn.pri{background:#1a3a5c;color:#fff;border-color:#1a3a5c}
.cfg-btn.pri:hover{background:#2c5282}
.cfg-btn.danger{color:#E53935;border-color:#ffcdd2}
.cfg-btn.danger:hover{background:#FFEBEE}
.cfg-btn.sm{padding:3px 8px;font-size:10px}
.cfg-add-row{display:flex;gap:8px;margin-top:8px}
.cfg-add-row input{flex:1;padding:7px 10px;border:1px solid #ddd;border-radius:7px;font-size:12px;font-family:inherit;outline:none}
.cfg-add-row input:focus{border-color:#1a3a5c}
.color-dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(0,0,0,.12);cursor:pointer;flex-shrink:0}
.color-swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;display:inline-block}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.sel{border-color:#333;transform:scale(1.2)}
/* 모달 */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:500;display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:22px;max-width:540px;width:95%;box-shadow:0 10px 40px rgba(0,0,0,.2);max-height:92vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal h2 .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;color:#fff}
.modal-section{margin-bottom:14px}
.modal-section h3{font-size:11px;font-weight:700;margin-bottom:8px;color:#555;padding-bottom:4px;border-bottom:1px solid #eee}
.modal-row{display:flex;gap:10px;margin-bottom:10px}
.field{flex:1;display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:600;color:#888}

<script>
// ============================================================

  GS_AUTO_LOAD_DELAY_MS:1500,

  // 분석 임계값
  ANOMALY_THRESHOLD_GRADE_PCT:30,
  ANOMALY_THRESHOLD_FULL_PCT:10,

  // 급여 분석
  PAY_HISTOGRAM_BIN:500000,

  // UI
  MAX_PERSONAL_LIST:300,
  MAX_ANOMALY_ROWS:40,
  MAX_MOVE_MATRIX_ROWS:30,

  // 퇴사사유 표준
  LEAVE_REASONS:["자발적 퇴사","계약만료","권고사직","건강 사유","가정 사유","학업","은퇴","기타"],

  // 디자인 컬러 팔레트 (JS에서 inline style 생성 시 사용)
  // CSS 변수와 동일해야 함
  COLOR:{
    primary:"#1565C0",  // 주요 정보·집계
    success:"#2E7D32",  // 재직·정상·실지급
    warning:"#F57F17",  // 경고·편차
    danger:"#C62828",   // 퇴사·위험
    purple:"#6A1B9A",   // 이력·이벤트
    teal:"#00838F",     // 조직·관계
    brand:"#1a3a5c"
  }
};

// ============================================================
// 🔑 UID 생성 — 동명이인 구분용 고유 ID
// ============================================================
// 주민번호 앞 6자리 + 최초입사일. 주민번호 없으면 이름 + 최초입사일
// v3 (옵션 C): [주민 7자리(생년월일+성별)] _ [firstJoin 8자리] _ [이름]
// 동일 생일·성별·입사일까지 우연히 같아도 이름까지 일치하지 않으면 unique
function generateUid(rec){
  if(!rec)return"";
  var firstJoin=rec.firstJoin||rec.joinDate||"";
  var firstJoinClean=String(firstJoin).replace(/[^0-9]/g,"").slice(0,8);
  var residentClean=String(rec.resident||"").replace(/[^0-9]/g,"");
  var nameKey=String(rec.name||"?").replace(/\(.*\)/g,"").trim().replace(/\s+/g,"").replace(/[.#$\[\]\/]/g,"");// Firebase 키 금지문자 제거(예: "Emma E. Ostlund"의 마침표)
  if(residentClean.length>=7){
    return residentClean.slice(0,7)+"_"+firstJoinClean+"_"+nameKey;
  }
  // 폴백 1: 7번째 자리 없는 레거시 → 6자리 + 이름
  if(residentClean.length>=6){
    return residentClean.slice(0,6)+"_"+firstJoinClean+"_"+nameKey;
  }
  // 폴백 2: 주민번호 없음 → 이름 + 입사일
  return nameKey+"_"+firstJoinClean;
}

// raw 기반 UID 일괄 재매칭 — 모든 emp 의 _uid 를 raw 와 매칭하여 새로 부여
// _cp_ / _split_ / _fj_ 접미사 다 무시하고 raw 기준으로 완전 재설정
// 전배자 (raw 의 동일 인물이 시점별로 다른 캠퍼스) 자동 인식 → 한 UID 유지
// 동명이인 (raw 에 다른 주민번호로 등록) 자동 분리 → 다른 UID
// raw 매칭 실패 emp → ghost UID (시트에 없는 사람)
function rebuildUidsFromRaw(dryRun){
  function _cn(s){return String(s||"").replace(/\(.*\)/g,"").trim();}
  var stats={matched:0,ghost:0,inout:0,mat:0};
  // 1. emp UID 재매칭
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md||!md.deptData)return;
    var rrs=md.rawRecords||[];
    md.deptData.campuses.forEach(function(c){
      c.teams.forEach(function(t){
        (t.employees||[]).forEach(function(e){
          if(!e.name)return;
          // 1차: 같은 월 + 이름 + 캠퍼스 + joinDate
          var rr=rrs.find(function(r){return _cn(r.name)===_cn(e.name)&&r.campus===c.name&&r.joinDate===e.joinDate;});
          // 2차: 같은 월 + 이름 + 캠퍼스
          if(!rr)rr=rrs.find(function(r){return _cn(r.name)===_cn(e.name)&&r.campus===c.name;});
          if(rr){
            if(!dryRun)e._uid=rr._uid;
            stats.matched++;
          }else{
            var gUid="ghost_"+_cn(e.name)+"_"+c.name+"_"+String(e.joinDate||"").replace(/-/g,"");
            if(!dryRun)e._uid=gUid;
            stats.ghost++;
          }
        });
      });
    });
  });
  // 2. inout / maternity 도 재매칭 (모든 월 raw 탐색)
  function findRaw(name,campus){
    var keys=Object.keys(MONTHS_DATA);
    for(var i=0;i<keys.length;i++){
      var md2=MONTHS_DATA[keys[i]];if(!md2||!md2.rawRecords)continue;
      var rr=md2.rawRecords.find(function(r){return _cn(r.name)===_cn(name)&&r.campus===campus;});
      if(rr)return rr;
    }
    for(var j=0;j<keys.length;j++){
      var md3=MONTHS_DATA[keys[j]];if(!md3||!md3.rawRecords)continue;
      var rr2=md3.rawRecords.find(function(r){return _cn(r.name)===_cn(name);});
      if(rr2)return rr2;
    }
    return null;
  }
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md)return;
    (md.inoutRecords||[]).forEach(function(io){
      if(!io.name)return;
      var rr=findRaw(io.name,io.campus);
      if(rr&&!dryRun){io._uid=rr._uid;stats.inout++;}
    });
    (md.maternityRecords||[]).forEach(function(m){
      if(!m.name)return;
      var rr=findRaw(m.name,m.campus);
      if(rr&&!dryRun){m._uid=rr._uid;stats.mat++;}
    });
  });
  if(!dryRun){
    if(typeof invalidateTimelineCache==="function")invalidateTimelineCache();
    if(typeof rebuildRetiredEmployees==="function")rebuildRetiredEmployees();
    if(typeof scheduleSave==="function")scheduleSave();
    if(typeof render==="function")render();
  }
  console.log("===== raw 기반 재매칭 "+(dryRun?"[DRY-RUN]":"[실행]")+" =====");
  console.log("매칭 emp:",stats.matched,"| ghost emp:",stats.ghost,"| inout:",stats.inout,"| mat:",stats.mat);
  return stats;
}

// 캠퍼스별 분리 — 같은 (UID+이름) emp 가 여러 캠퍼스에 있으면 캠퍼스별로 별도 UID
// 가장 emp 많은 캠퍼스가 원래 UID 유지, 나머지는 oldUid + "_cp_" + 캠퍼스명
function detachByCampus(dryRun){
  var groups={};
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md||!md.deptData)return;
    md.deptData.campuses.forEach(function(c){
      c.teams.forEach(function(t){
        (t.employees||[]).forEach(function(e){
          if(!e._uid||!e.name)return;
          var key=e._uid+"|"+e.name;
          if(!groups[key])groups[key]={};
          if(!groups[key][c.name])groups[key][c.name]=[];
          groups[key][c.name].push(e);
        });
      });
    });
  });
  var stats={split:0,plan:[]};
  Object.keys(groups).forEach(function(key){
    var byCp=groups[key];
    var cps=Object.keys(byCp);
    if(cps.length<=1)return;
    cps.sort(function(a,b){return byCp[b].length-byCp[a].length;});
    var keepCp=cps[0];
    var oldUid=key.split("|")[0];
    var name=key.split("|")[1];
    cps.slice(1).forEach(function(cp){
      var newUid=oldUid+"_cp_"+cp;
      byCp[cp].forEach(function(e){
        if(!dryRun)e._uid=newUid;
        stats.split++;
      });
      stats.plan.push({name:name,keepCampus:keepCp,splitCampus:cp,count:byCp[cp].length,newUid:newUid});
    });
  });
  if(!dryRun){
    if(typeof invalidateTimelineCache==="function")invalidateTimelineCache();
    if(typeof rebuildRetiredEmployees==="function")rebuildRetiredEmployees();
    if(typeof scheduleSave==="function")scheduleSave();
    if(typeof render==="function")render();
  }
  console.log("캠퍼스별 분리 "+(dryRun?"[DRY-RUN]":"[실행]")+": "+stats.split+"건");
  console.table(stats.plan);
  return stats;
}

// 분리 취소 — _split_XXX 또는 _fj_XXX 또는 _cp_XXX 패턴의 새 UID 를 원래 UID 로 되돌림
// targetName 지정 시 그 이름만, 안 지정 시 전체
function undoSplit(targetName){
  var count=0;
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md||!md.deptData)return;
    md.deptData.campuses.forEach(function(c){
      c.teams.forEach(function(t){
        (t.employees||[]).forEach(function(e){
          if(!e._uid)return;
          if(targetName&&e.name!==targetName)return;
          var m=String(e._uid).match(/^(.+?)_(split|fj|cp)_/);
          if(m){e._uid=m[1];count++;}
        });
      });
    });
    (md.inoutRecords||[]).forEach(function(io){
      if(!io._uid||(targetName&&io.name!==targetName))return;
      var m=String(io._uid).match(/^(.+?)_(split|fj|cp)_/);
      if(m){io._uid=m[1];count++;}
    });
    (md.maternityRecords||[]).forEach(function(r){
      if(!r._uid||(targetName&&r.name!==targetName))return;
      var m=String(r._uid).match(/^(.+?)_(split|fj|cp)_/);
      if(m){r._uid=m[1];count++;}
    });
  });
  if(typeof invalidateTimelineCache==="function")invalidateTimelineCache();
  if(typeof rebuildRetiredEmployees==="function")rebuildRetiredEmployees();
  if(typeof scheduleSave==="function")scheduleSave();
  if(typeof render==="function")render();
  console.log("분리 취소: "+count+"건"+(targetName?" ("+targetName+")":""));
  return count;
}

// v2: raw의 firstJoin 기반 동명이인 분리 — emp 별로 raw 매칭 후 firstJoin 비교
// joinDate 보다 정확. raw가 정확히 입력된 사람만 분리됨 (raw 매칭 실패 시 분리 안 함 = 보수적)
function splitMergedEmpsByFirstJoin(dryRun){
  var stats={split:0,plan:[],unmatched:[]};
  function _cn(s){return String(s||"").replace(/\(.*\)/g,"").trim();}
  // 1. 각 emp 에 firstJoin 부여 (같은 월 raw 매칭, 캠퍼스·joinDate·이름 우선)
  var empData=[];
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md||!md.deptData)return;
    var rrs=md.rawRecords||[];
    md.deptData.campuses.forEach(function(c){
      c.teams.forEach(function(t){
        (t.employees||[]).forEach(function(e){
          if(!e.name||!e._uid)return;
          // 정확도 높은 순으로 매칭
          var rr=rrs.find(function(r){return _cn(r.name)===_cn(e.name)&&r.campus===c.name&&r.joinDate===e.joinDate;});
          if(!rr)rr=rrs.find(function(r){return _cn(r.name)===_cn(e.name)&&r.campus===c.name;});
          if(!rr)rr=rrs.find(function(r){return _cn(r.name)===_cn(e.name)&&r.joinDate===e.joinDate;});
          var fj=rr?(rr.firstJoin||rr.joinDate||""):"";
          empData.push({emp:e,name:e.name,campus:c.name,joinDate:e.joinDate,month:mk,firstJoin:fj,uid:e._uid,matched:!!rr});
        });
      });
    });
  });
  // 2. (UID + 이름) 그룹화 + firstJoin 서브그룹
  var grouped={};
  empData.forEach(function(d){
    var key=d.uid+"|"+d.name;
    if(!grouped[key])grouped[key]={};
    var sub=d.firstJoin||"_unknown_";
    if(!grouped[key][sub])grouped[key][sub]=[];
    grouped[key][sub].push(d);
  });
  // 3. 분리 — 같은 (UID+이름) 안에 firstJoin 다른 그룹 있으면 동명이인
  Object.keys(grouped).forEach(function(key){
    var subs=grouped[key];
    var subKeys=Object.keys(subs);
    var validSubs=subKeys.filter(function(s){return s!=="_unknown_";});
    if(validSubs.length<=1)return;// 식별된 firstJoin 이 1종류면 같은 사람 (또는 식별 불가)
    // 가장 많은 emp 가진 firstJoin 유지, 나머지 분리
    validSubs.sort(function(a,b){return subs[b].length-subs[a].length;});
    var keep=validSubs[0];
    var oldUid=key.split("|")[0];
    var name=key.split("|")[1];
    validSubs.slice(1).forEach(function(sub){
      var newUid=oldUid+"_fj_"+String(sub).replace(/-/g,"");
      subs[sub].forEach(function(d){
        if(!dryRun)d.emp._uid=newUid;
        stats.split++;
      });
      stats.plan.push({name:name,oldUid:oldUid,keepFirstJoin:keep,splitFirstJoin:sub,newUid:newUid,count:subs[sub].length});
    });
    // _unknown_ 은 가장 큰 그룹에 흡수 (분리 안 함)
  });
  // 매칭 실패 emp 통계
  empData.forEach(function(d){if(!d.matched)stats.unmatched.push({name:d.name,campus:d.campus,month:d.month,uid:d.uid});});
  if(!dryRun){
    if(typeof invalidateTimelineCache==="function")invalidateTimelineCache();
    if(typeof rebuildRetiredEmployees==="function")rebuildRetiredEmployees();
    if(typeof scheduleSave==="function")scheduleSave();
    if(typeof render==="function")render();
  }
  console.log("===== firstJoin 기반 분리 "+(dryRun?"[DRY-RUN]":"[실행]")+" =====");
  console.log("분리 emp:",stats.split,"| raw 매칭 실패 emp:",stats.unmatched.length);
  console.table(stats.plan);
  return stats;
}

// 동명이인 분리 — 같은 (UID + 이름) 그룹 안에 joinDate 다른 사람이 섞여있으면 분리
// dryRun=true 이면 변경 없이 분리 대상 목록만 반환
function splitMergedEmps(dryRun){
  var stats={groups:0,split:0,plan:[]};
  // 1. (UID + 이름) 그룹화 — 모든 월 통합
  var grouped={};
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md||!md.deptData)return;
    md.deptData.campuses.forEach(function(c){
      c.teams.forEach(function(t){
        (t.employees||[]).forEach(function(e){
          if(!e._uid||!e.name)return;
          var key=e._uid+"|"+e.name;
          if(!grouped[key])grouped[key]=[];
          grouped[key].push({month:mk,campus:c.name,team:t.name,emp:e});
        });
      });
    });
  });
  // 2. 각 그룹에서 joinDate 다른 서브그룹 식별
  Object.keys(grouped).forEach(function(key){
    var entries=grouped[key];
    if(entries.length<=1)return;
    var byJD={};
    entries.forEach(function(en){
      var jd=en.emp.joinDate||"_blank_";
      if(!byJD[jd])byJD[jd]=[];
      byJD[jd].push(en);
    });
    var jds=Object.keys(byJD);
    // joinDate가 빈값(_blank_) 만 있거나 모두 같은 joinDate면 분리 안 함
    var validJds=jds.filter(function(j){return j!=="_blank_";});
    if(validJds.length<=1)return;
    // 가장 많은 emp 가진 joinDate 가 원래 UID 유지, 나머지는 새 UID
    jds.sort(function(a,b){return byJD[b].length-byJD[a].length;});
    var keepJD=jds[0];
    var oldUid=key.split("|")[0];
    var name=key.split("|")[1];
    var planItem={name:name,oldUid:oldUid,keep:keepJD,splits:[]};
    jds.slice(1).forEach(function(jd){
      if(jd==="_blank_")return;// 빈 joinDate 는 분리 안 함 (가장 큰 그룹에 흡수)
      var newUid=oldUid+"_split_"+String(jd).replace(/-/g,"");
      planItem.splits.push({newUid:newUid,joinDate:jd,count:byJD[jd].length,campuses:byJD[jd].map(function(en){return en.campus+"/"+en.team;})});
      if(!dryRun){
        byJD[jd].forEach(function(en){en.emp._uid=newUid;stats.split++;});
      }else{
        stats.split+=byJD[jd].length;
      }
    });
    if(planItem.splits.length){
      stats.groups++;
      stats.plan.push(planItem);
    }
  });
  if(!dryRun){
    if(typeof invalidateTimelineCache==="function")invalidateTimelineCache();
    if(typeof rebuildRetiredEmployees==="function")rebuildRetiredEmployees();
    if(typeof scheduleSave==="function")scheduleSave();
    if(typeof render==="function")render();
  }
  console.log("===== 동명이인 분리 "+(dryRun?"[DRY-RUN — 변경 없음]":"[실행됨]")+" =====");
  console.log("그룹: "+stats.groups+" | 분리 emp: "+stats.split);
  console.table(stats.plan.map(function(p){return {name:p.name,oldUid:p.oldUid,keepJoin:p.keep,splitCount:p.splits.length,total:p.splits.reduce(function(a,s){return a+s.count;},0)+p.splits.length};}));
  return stats;
}

// 옛 UID(2부분 형식: 6자리_8자리)를 새 UID(3부분 형식: 7자리_8자리_이름)로 일괄 변환
// raw 매칭 실패로 옛 UID가 남은 emp/inout/mat 정리 — migrate 후에도 잔여분이 있으면 호출
function rmOldUids(){
  var counts={emp:0,inout:0,mat:0,unresolved:[]};
  var map={};
  function _cn(s){return String(s||"").replace(/\(.*\)/g,"").trim();}
  // 1. raw 의 새 UID 들에서 옛 UID prefix 추출 → 매핑 빌드 (충돌 시 후보 배열)
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md||!md.rawRecords)return;
    md.rawRecords.forEach(function(r){
      if(!r._uid)return;
      var parts=String(r._uid).split("_");
      if(parts.length<3)return;// 이미 옛 형식이면 스킵
      if(parts[0].length<7)return;
      var oldUid=parts[0].slice(0,6)+"_"+parts[1];
      if(!map[oldUid])map[oldUid]=[];
      var dup=map[oldUid].some(function(x){return x.newUid===r._uid;});
      if(!dup)map[oldUid].push({newUid:r._uid,name:r.name,campus:r.campus});
    });
  });
  function pickNewUid(oldUid,name,campus){
    var cands=map[oldUid];if(!cands||!cands.length)return null;
    if(cands.length===1)return cands[0].newUid;
    var hit=cands.find(function(x){return _cn(x.name)===_cn(name)&&x.campus===campus;});
    if(hit)return hit.newUid;
    hit=cands.find(function(x){return _cn(x.name)===_cn(name);});
    if(hit)return hit.newUid;
    return null;
  }
  // 2. emp 변환
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md||!md.deptData)return;
    md.deptData.campuses.forEach(function(c){
      c.teams.forEach(function(t){
        (t.employees||[]).forEach(function(e){
          if(!map[e._uid])return;
          var newUid=pickNewUid(e._uid,e.name,c.name);
          if(newUid){e._uid=newUid;counts.emp++;}
          else counts.unresolved.push({type:"emp",uid:e._uid,name:e.name,campus:c.name});
        });
      });
    });
  });
  // 3. inout / maternity 변환
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md)return;
    (md.inoutRecords||[]).forEach(function(io){
      if(!map[io._uid])return;
      var newUid=pickNewUid(io._uid,io.name,io.campus);
      if(newUid){io._uid=newUid;counts.inout++;}
      else counts.unresolved.push({type:"inout",uid:io._uid,name:io.name,campus:io.campus});
    });
    (md.maternityRecords||[]).forEach(function(m){
      if(!map[m._uid])return;
      var newUid=pickNewUid(m._uid,m.name,m.campus);
      if(newUid){m._uid=newUid;counts.mat++;}
      else counts.unresolved.push({type:"mat",uid:m._uid,name:m.name,campus:m.campus});
    });
  });
  if(typeof invalidateTimelineCache==="function")invalidateTimelineCache();
  if(typeof rebuildRetiredEmployees==="function")rebuildRetiredEmployees();
  if(typeof scheduleSave==="function")scheduleSave();
  if(typeof render==="function")render();
  console.log("===== 옛 UID 정리 결과 =====");
  console.log(counts);
  if(counts.unresolved.length)console.warn("미해결 "+counts.unresolved.length+"건 — 매핑 실패");
  return counts;
}

// UID 마이그레이션 v3 — 모든 월/전역의 _uid 를 새 형식으로 재생성
// 콘솔에서 migrateUidsToV3() 호출하여 실행
function migrateUidsToV3(){
  var stats={raw:0,emp:0,inout:0,mat:0,adminCards:0,adminComments:0,payNotes:0,conflicts:[]};
  // PHASE 1: oldUid → [{newUid, name, campus}] 매핑 빌드
  var oldToNew={};
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md||!md.rawRecords)return;
    md.rawRecords.forEach(function(r){
      var oldUid=r._uid;var newUid=generateUid(r);
      if(!oldUid||!newUid||oldUid===newUid)return;
      if(!oldToNew[oldUid])oldToNew[oldUid]=[];
      var already=oldToNew[oldUid].some(function(x){return x.newUid===newUid;});
      if(!already)oldToNew[oldUid].push({newUid:newUid,name:r.name,campus:r.campus});
    });
  });
  // PHASE 2: rawRecords 의 _uid 재생성
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md||!md.rawRecords)return;
    md.rawRecords.forEach(function(r){
      var newUid=generateUid(r);
      if(newUid&&r._uid!==newUid){r._uid=newUid;stats.raw++;}
    });
  });
  // PHASE 3: deptData employees — 다단계 매칭 폴백
  function _cn(s){return String(s||"").replace(/\(.*\)/g,"").trim();}
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md||!md.deptData)return;
    (md.deptData.campuses||[]).forEach(function(cp){
      (cp.teams||[]).forEach(function(t){
        (t.employees||[]).forEach(function(e){
          // 1차: 같은 월 + 같은 캠퍼스 + 이름
          var rr=(md.rawRecords||[]).find(function(r){return _cn(r.name)===_cn(e.name)&&r.campus===cp.name;});
          // 2차: 같은 월 + 이름만
          if(!rr)rr=(md.rawRecords||[]).find(function(r){return _cn(r.name)===_cn(e.name);});
          // 3차: 모든 월 + 같은 캠퍼스 + 이름
          if(!rr){
            var keys=Object.keys(MONTHS_DATA);
            for(var i=0;i<keys.length;i++){
              var md2=MONTHS_DATA[keys[i]];if(!md2||!md2.rawRecords)continue;
              rr=md2.rawRecords.find(function(r){return _cn(r.name)===_cn(e.name)&&r.campus===cp.name;});
              if(rr)break;
            }
          }
          // 4차: 모든 월 + 이름만 (마지막 폴백)
          if(!rr){
            var keys2=Object.keys(MONTHS_DATA);
            for(var j=0;j<keys2.length;j++){
              var md3=MONTHS_DATA[keys2[j]];if(!md3||!md3.rawRecords)continue;
              rr=md3.rawRecords.find(function(r){return _cn(r.name)===_cn(e.name);});
              if(rr)break;
            }
          }
          if(rr&&rr._uid&&e._uid!==rr._uid){e._uid=rr._uid;stats.emp++;}
        });
      });
    });
  });
  // PHASE 4: inoutRecords + maternityRecords — 모든 월의 raw 에서 이름 매칭
  function _findRawByName(name,campus){
    var keys=Object.keys(MONTHS_DATA);
    for(var i=0;i<keys.length;i++){
      var md2=MONTHS_DATA[keys[i]];if(!md2||!md2.rawRecords)continue;
      var found=md2.rawRecords.find(function(r){return _cn(r.name)===_cn(name)&&(!campus||r.campus===campus);});
      if(found)return found;
    }
    return null;
  }
  Object.keys(MONTHS_DATA).forEach(function(mk){
    var md=MONTHS_DATA[mk];if(!md)return;
    (md.inoutRecords||[]).forEach(function(io){
      var rr=_findRawByName(io.name,io.campus);
      if(rr&&rr._uid&&io._uid!==rr._uid){io._uid=rr._uid;stats.inout++;}
    });
    (md.maternityRecords||[]).forEach(function(m){
      var rr=_findRawByName(m.name,m.campus);
      if(rr&&rr._uid&&m._uid!==rr._uid){m._uid=rr._uid;stats.mat++;}
    });
  });
  // PHASE 5: 전역 키 (1:1 매핑만 안전하게 변환)
  [["GLOBAL_ADMIN_CARDS","adminCards"],["GLOBAL_ADMIN_COMMENTS","adminComments"],["GLOBAL_PAY_HISTORY_NOTES","payNotes"]].forEach(function(pair){
    var gkey=pair[0],sKey=pair[1];var obj=window[gkey];
    if(!obj||typeof obj!=="object")return;
    Object.keys(obj).forEach(function(oldKey){
      var mappings=oldToNew[oldKey];if(!mappings||!mappings.length)return;
      if(mappings.length===1){
        var newKey=mappings[0].newUid;
        if(newKey&&newKey!==oldKey){obj[newKey]=obj[oldKey];delete obj[oldKey];stats[sKey]++;}
      }else{
        stats.conflicts.push({store:gkey,oldKey:oldKey,candidates:mappings});
      }
    });
  });
  // PHASE 6: 퇴직자 재구축 + 캐시 무효화 + 저장
  if(typeof rebuildRetiredEmployees==="function")rebuildRetiredEmployees();
  if(typeof invalidateTimelineCache==="function")invalidateTimelineCache();
  if(typeof scheduleSave==="function")scheduleSave();
  if(typeof render==="function")render();
  console.log("===== UID 마이그레이션 v3 결과 =====");
  console.log(stats);
  if(stats.conflicts.length){
    console.warn("⚠ 전역 키 충돌 "+stats.conflicts.length+"건 — 같은 옛 UID에 여러 사람 매핑. 수동 검토 필요:");
    console.table(stats.conflicts);
  }
  return stats;
}

// 탭 이름 → "YYYY년 M월" 정규화
// 허용: "2025-01", "2025-1", "202501", "2025년 1월", "2025년 01월", "2025.01", "2025/1" ...
function normalizeMonthKey(tabName){
  var s=String(tabName||"").trim();
  if(!s)return null;
  var m;
  // YYYY-MM / YYYY-M / YYYY.M / YYYY/M / YYYY_M
  m=s.match(/^(\d{4})[-_\.\/](\d{1,2})$/);
  if(m)return parseInt(m[1])+"년 "+parseInt(m[2])+"월";
  // YYYYMM
  m=s.match(/^(\d{4})(\d{2})$/);
  if(m){var mm=parseInt(m[2]);if(mm>=1&&mm<=12)return parseInt(m[1])+"년 "+mm+"월";}
  // YYYY년 M월
  m=s.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/);
  if(m)return parseInt(m[1])+"년 "+parseInt(m[2])+"월";
  return null;// 월 이름 아닌 탭 (설정/참고 등)
}
// 월 키 정렬용 비교 (YYYY년 M월)
function monthCompare(a,b){
  var ma=String(a).match(/(\d{4})년\s*(\d+)월/);
  var mb=String(b).match(/(\d{4})년\s*(\d+)월/);
  if(!ma||!mb)return String(a).localeCompare(String(b));
  var d=parseInt(ma[1])-parseInt(mb[1]);
  return d!==0?d:parseInt(ma[2])-parseInt(mb[2]);
}

function isMonthAdminHidden(m){
  if(isAdminMode())return false;
  var ym=String(m).match(/(\d{4})년\s*(\d+)월/);
  if(!ym)return false;
  var v=parseInt(ym[1],10)*12+parseInt(ym[2],10);
  return v>=(2025*12+1)&&v<=(2026*12+4);
}

// 한글 IME 조합 안전 헬퍼 — 자음/모음 조합 중에는 render 스킵
// 사용법: oninput="safeInputUpdate(this,function(v){state.xxx=v;});"
// 한글 IME 조합 안전 헬퍼 — 디바운스로 render 지연해서 조합 깨짐 방지
// 250ms 동안 추가 입력 없을 때에만 render() 실행
// composition 중이면 render 건너뜀
var _searchDebounceTimer=null;
function safeInputUpdate(inputEl,setter){
  // 상태는 즉시 반영 (검색어 저장)
  setter(inputEl.value);
  // 기존 디바운스 타이머 취소 — 추가 입력 들어온 경우
  if(_searchDebounceTimer)clearTimeout(_searchDebounceTimer);
  _searchDebounceTimer=setTimeout(function(){
    _searchDebounceTimer=null;
    // 여전히 조합 중이면 다음 기회로 미룸 (재호출 대기)
    if(inputEl.dataset._composing==="1")return;
    var sel=inputEl.selectionStart;
    var id=inputEl.id;
    render();
    // 리렌더 후 포커스·커서 복원
    requestAnimationFrame(function(){
      var ne=document.getElementById(id);
      if(ne&&ne!==inputEl){
        ne.focus();
        try{ne.setSelectionRange(sel,sel);}catch(e){}
      }
    });
  },250);
}

function getStats(){
  var total=0,byCampus={},byGrade={},byGubn={},totalBasePay=0,totalNetPay=0,totalDeduct=0;
  // 전배자(같은 사람·여러 캠퍼스)는 캠퍼스마다 별도 카운트 — 개인이력 타임라인만 통합
  DD().campuses.forEach(function(cp){
    var ct=0;
    var cpName=typeof normalizeCampus==="function"?normalizeCampus(cp.name):cp.name;
    cp.teams.forEach(function(t){
      (t.employees||[]).forEach(function(e){
        ct++;
        total++;
        byGrade[e.grade]=(byGrade[e.grade]||0)+1;
        byGubn[e.gubn]=(byGubn[e.gubn]||0)+1;
        totalBasePay+=e.basePay||0;
        totalNetPay+=e.netPay||0;
        totalDeduct+=e.deduct||0;
      });
    });
    byCampus[cpName]=(byCampus[cpName]||0)+ct;
  });
  return{total:total,byCampus:byCampus,byGrade:byGrade,byGubn:byGubn,totalBasePay:totalBasePay,totalNetPay:totalNetPay,totalDeduct:totalDeduct};
}

function getAllEmployees(){
  var list=[];
  // 전배자(같은 사람·여러 캠퍼스)는 캠퍼스마다 별도 행으로 유지 — 개인이력 타임라인만 통합
  DD().campuses.forEach(function(cp){
    var cpName=typeof normalizeCampus==="function"?normalizeCampus(cp.name):cp.name;
    cp.teams.forEach(function(t){
      (t.employees||[]).forEach(function(e){
        list.push(Object.assign({campus:cpName,team:t.name},e));
      });
    });
  });
  return list;
}

function getAllManagersAllTime(){
  var allTl=buildAllTimelines();
  var map={};
  Object.keys(allTl).forEach(function(uid){
    var tl=allTl[uid];
    var latestMgr=null;
    // 최신 월부터 역순 탐색, 관리자 직책인 최근 레코드 선택
    for(var i=tl.length-1;i>=0;i--){
      if(isManagerGrade(tl[i].grade)){latestMgr=tl[i];break;}
    }
    if(latestMgr){
      map[uid]=Object.assign({_uid:uid,_month:latestMgr.month},latestMgr);
    }
  });
  return Object.keys(map).map(function(u){return map[u];});
}

  DD().campuses.forEach(function(cp){if(cp.name!==fromCampus)return;cp.teams.forEach(function(t){if(t.name!==fromTeam)return;for(var i=0;i<t.employees.length;i++){if(t.employees[i].name===name){emp=t.employees.splice(i,1)[0];return;}}});});

function doAddEmployee(){
  if(!_addCtx)return;
  var nm=document.getElementById("new_name").value.trim();if(!nm){notify("이름 입력","warn");return;}
  pushUndo(nm+" 추가");
  var resEl=document.getElementById("new_resident");
  var firstJoinEl=document.getElementById("new_firstjoin");
  var firstJoin=firstJoinEl?firstJoinEl.value.trim():"";
  var resident=resEl?resEl.value.trim():"";
  var joinDate=document.getElementById("new_join").value.trim();
  var emp={
    name:nm,
    empId:document.getElementById("new_empid").value.trim(),
    grade:document.getElementById("new_grade").value,
    gubn:document.getElementById("new_gubn").value,
    joinDate:joinDate,
    firstJoin:firstJoin||joinDate,
    resident:resident,
    phone:document.getElementById("new_phone").value.trim(),
    basePay:parseInt(document.getElementById("new_base").value)||0,
    food:0,carAllow:0,overTime:0,deduct:0,
    netPay:parseInt(document.getElementById("new_net").value)||0,
    _source:"manual"
  };
  emp._uid=generateUid(emp);
  var added=false;
  DD().campuses.forEach(function(cp){if(cp.name!==_addCtx.campus||added)return;cp.teams.forEach(function(t){if(t.name!==_addCtx.team||added)return;t.employees.push(emp);added=true;});});

// ===== 렌더 함수들 =====
// ===== 헬퍼: 주민번호로 나이 계산 =====
function calcAge(resident){
  if(!resident||resident.length<6)return null;
  var clean=resident.replace(/[^0-9]/g,"");if(clean.length<7)return null;
  var yy=parseInt(clean.slice(0,2)),mm=parseInt(clean.slice(2,4)),dd=parseInt(clean.slice(4,6));
  var g=parseInt(clean[6]);
  var yyyy=(g===1||g===2||g===5||g===6)?1900+yy:(g===3||g===4||g===7||g===8)?2000+yy:1900+yy;
  var now=new Date();var age=now.getFullYear()-yyyy;
  if(now.getMonth()+1<mm||(now.getMonth()+1===mm&&now.getDate()<dd))age--;
  return(age>0&&age<100)?age:null;
}
// 근속연수 계산 (정수 단위, 개인 표시용)
function calcTenure(joinDate){
  if(!joinDate)return null;
  var d=new Date(joinDate.replace(/\./g,"-"));if(isNaN(d))return null;
  var now=new Date();var y=now.getFullYear()-d.getFullYear();
  if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate()))y--;
  return y>=0?y:null;
}
// 정밀 근속 (소수점 1자리, 평균·순위 계산용 — 개월 단위로 정확)
function calcTenureDecimal(joinDate){
  if(!joinDate)return null;
  var d=new Date(String(joinDate).replace(/\./g,"-"));if(isNaN(d))return null;
  var now=new Date();
  var months=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());
  if(now.getDate()<d.getDate())months--;
  if(months<0)return null;
  return Math.round(months/12*10)/10;
}
// 개인이력 탭과 동일 기준: 모든 월의 타임라인을 훑어 가장 이른 입사일 반환
// (1) raw의 firstJoin 우선, 없으면 (2) 가장 이른 월의 emp.joinDate, 그것도 없으면 fallback
function getEmpFirstJoinDate(name,fallback,uid){
  // UID 중간부(주민_입사일_이름)에 입사일이 들어있음 → 동명이인 안전. 가장 신뢰하는 출처로 우선 사용.
  if(uid){
    var _up=String(uid).split("_");
    if(_up.length>=2&&/^\d{8}$/.test(_up[1]))return _up[1].slice(0,4)+"-"+_up[1].slice(4,6)+"-"+_up[1].slice(6,8);
  }
  if(!name)return fallback||"";
  try{
    if(typeof getUidsByName==="function"&&typeof buildAllTimelines==="function"){
      var uids=getUidsByName(name);
      var tls=buildAllTimelines();
      var earliest="";
      uids.forEach(function(u){
        var tl=tls[u];if(!tl||!tl.length)return;
        var d=tl[0].joinDate||"";
        if(d&&(!earliest||d<earliest))earliest=d;
      });
      if(earliest)return earliest;
    }
  }catch(e){}
  // 폴백: 모든 월 raw에서 firstJoin 직접 검색
  var mks=Object.keys(MONTHS_DATA||{});
  for(var i=0;i<mks.length;i++){
    var rrs=MONTHS_DATA[mks[i]]&&MONTHS_DATA[mks[i]].rawRecords;if(!rrs)continue;
    var match=rrs.find(function(r){return r.name===name&&r.firstJoin&&String(r.firstJoin).trim();});
    if(match)return String(match.firstJoin).trim();
  }
  return fallback||"";
}
// 최초입사일 우선 근속 계산 (개인이력 탭과 동일 기준)
function calcTenureByName(name,fallbackJoin){
  return calcTenureDecimal(getEmpFirstJoinDate(name,fallbackJoin));
}

// 평균임금/지급합계 표시용 — 시트의 지급합계(totalPay)에서 자녀교육비(childEdu)를 뺀 금액
// rr.totalPay 가 없으면 e.basePay (monthlyBasePay) 폴백
// 전배자(같은 달 두 캠퍼스)·동명이인 정확 매칭: UID+캠퍼스 우선 → 이름+캠퍼스 → UID → 이름
// campusHint: e.campus 가 없는 호출부(캠퍼스 카드 등)에서 캠퍼스명을 직접 넘김
// rawsOverride: 전월 등 다른 월 raw 와 비교할 때 그 월의 rawRecords 를 넘김(기본=현재 월)
function _findRawForPay(e,campusHint,rawsOverride){
  if(!e)return null;
  var cp=campusHint||e.campus||null;
  var uid=e._uid||null;
  var raws=rawsOverride||(D().rawRecords||[]);
  var rr=null;
  if(uid&&cp)rr=raws.find(function(r){return r._uid===uid&&r.campus===cp;});
  if(!rr&&cp)rr=raws.find(function(r){return r.name===e.name&&r.campus===cp;});
  if(!rr&&uid)rr=raws.find(function(r){return r._uid===uid;});
  if(!rr)rr=raws.find(function(r){return r.name===e.name;});
  return rr;
}
function getEmpPayForAvg(e,campusHint,rawsOverride){
  var rr=_findRawForPay(e,campusHint,rawsOverride);
  if(rr&&rr.totalPay)return Math.max(0,(rr.totalPay||0)-(rr.childEdu||0));
  return (e&&e.basePay)||0;
}
// 합계 표시용 — 시트의 지급합계(totalPay) 그대로(자녀교육비 포함), 빈칸은 0(계약급여 폴백 없음)
//   매칭은 자기 캠퍼스 안에서만(uid+캠퍼스 → 이름+캠퍼스) — 캠퍼스 밖 폴백을 두면 전배/동명이인이
//   다른 캠퍼스 행을 이중 합산해 전체 합이 시트보다 커짐. 합계는 시트 합과 일치해야 하므로 금지.
function getEmpPayReal(e,campusHint,rawsOverride){
  if(!e)return 0;
  var cp=campusHint||e.campus||null;
  var uid=e._uid||null;
  var raws=rawsOverride||(D().rawRecords||[]);
  var rr=null;
  if(uid&&cp)rr=raws.find(function(r){return r._uid===uid&&r.campus===cp;});
  if(!rr&&cp)rr=raws.find(function(r){return r.name===e.name&&r.campus===cp;});
  return (rr&&rr.totalPay)||0;
}
// 캠퍼스/전체 합계는 직원명단을 거치지 않고 raw(시트)를 직접 합산 — 시트 합과 정의상 100% 일치
//   (직원명단 경유 시 월중 퇴사자 등 raw에만 있는 지급분이 빠지거나 중복 매칭으로 어긋남)
function sumRawPay(cp,rawsOverride){
  var raws=rawsOverride||(D().rawRecords||[]);var s=0;
  raws.forEach(function(r){if(cp&&cp!=="전체"&&r.campus!==cp)return;s+=r.totalPay||0;});
  return s;

function sumRawNet(cp,rawsOverride){

// 표준편차
function stdev(arr){
  if(arr.length<2)return 0;
  var mean=arr.reduce(function(a,b){return a+b;},0)/arr.length;
  var sq=arr.map(function(x){return Math.pow(x-mean,2);});
  return Math.round(Math.sqrt(sq.reduce(function(a,b){return a+b;},0)/arr.length));
}

var _timelineCache=null;var _timelineCacheKey=null;

          }

// ===== 동일인 표시 통합 (2단계 — UID/원본 데이터 불변, 개인이력 화면 전용) =====
// 같은 주민번호 13자리 + 재직월 공백 없음(연속) = 개명·표기오류·입사일오기입으로 갈라진 같은 사람 → 한 카드로 표시
// 재직월에 공백 있으면(재입사 가능성) 합치지 않음 — 별개 재직기간 유지, 동일인 링크만
var _mergeGrpCache=null,_mergeGrpKey=null;
function getDisplayMergeGroups(){
  var key=Object.keys(MONTHS_DATA).length+"|"+Object.keys(MONTHS_DATA).sort().join(",");
  if(_mergeGrpCache&&_mergeGrpKey===key)return _mergeGrpCache;
  var months=Object.keys(MONTHS_DATA).sort(monthCompare);
  var mIdx={};months.forEach(function(m,i){mIdx[m]=i;});
  var info={};// uid → {res: 전기간 최장 주민번호, months:{}}
  months.forEach(function(mk){
    (MONTHS_DATA[mk].rawRecords||[]).forEach(function(r){
      if(!r._uid)return;
      var d=String(r.resident||"").replace(/[^\d]/g,"");
      var o=info[r._uid]||(info[r._uid]={res:"",months:{}});
      if(d.length>o.res.length)o.res=d;
      o.months[mk]=1;
    });
  });
  var by13={};
  Object.keys(info).forEach(function(u){
    if(info[u].res.length<13)return;
    var k=info[u].res.slice(0,13);
    (by13[k]=by13[k]||[]).push(u);
  });
  var map={},groups={};// map: uid→대표uid / groups: 대표uid→{uids:[...]}
  Object.keys(by13).forEach(function(k){
    var us=by13[k];
    if(us.length<2)return;
    // 합산 재직월에 공백 있으면(재입사) 통합 제외
    var idxSet={};
    us.forEach(function(u){Object.keys(info[u].months).forEach(function(m){idxSet[mIdx[m]]=1;});});
    var idxs=Object.keys(idxSet).map(Number).sort(function(a,b){return a-b;});
    if((idxs[idxs.length-1]-idxs[0]+1)!==idxs.length)return;
    // 대표 = 가장 최근 월까지 재직한 UID (현재 이름)
    var prim=us.slice().sort(function(a,b){
      var la=Math.max.apply(null,Object.keys(info[a].months).map(function(m){return mIdx[m];}));
      var lb=Math.max.apply(null,Object.keys(info[b].months).map(function(m){return mIdx[m];}));
      return lb-la;
    })[0];
    groups[prim]={uids:us};
    us.forEach(function(u){map[u]=prim;});
  });
  _mergeGrpCache={map:map,groups:groups};
  _mergeGrpKey=key;
  return _mergeGrpCache;
}

// 통합 그룹의 합쳐진 타임라인
// 같은 달+같은 캠퍼스 중복(이름표기 변형) → 대표 UID 기록 1개만
// 같은 달+다른 캠퍼스(전배 월) → 둘 다 유지 (급여가 캠퍼스별로 나뉘어 있으므로 숨기면 왜곡)
function getMergedTimeline(uid){
  var all=buildAllTimelines();
  var g=getDisplayMergeGroups();
  var prim=g.map[uid]||uid;
  var grp=g.groups[prim];
  if(!grp)return{tl:all[uid]||[],merged:false,uids:[uid],primary:uid};
  var months=Object.keys(MONTHS_DATA).sort(monthCompare);
  var mIdx={};months.forEach(function(m,i){mIdx[m]=i;});
  var byKey={};
  grp.uids.forEach(function(u){
    (all[u]||[]).forEach(function(e){
      var k=e.month+"|"+(e.campus||"");
      if(!byKey[k]||u===prim)byKey[k]=e;
    });
  });
  var tl=Object.keys(byKey).map(function(k){return byKey[k];}).sort(function(a,b){
    return(mIdx[a.month]-mIdx[b.month])||String(a.campus||"").localeCompare(String(b.campus||""),"ko");
  });
  return{tl:tl,merged:true,uids:grp.uids,primary:prim};
}

// 타임라인에서 변화 이벤트 감지
function detectTimelineEvents(timeline){
  if(!timeline.length)return[];

  events.push({month:timeline[0].month,type:"입사",icon:"🎉",desc:timeline[0].campus+" "+timeline[0].team+" "+timeline[0].grade,color:"#2E7D32"});
  for(var i=1;i<timeline.length;i++){
    var prev=timeline[i-1],cur=timeline[i];
    if(prev.campus!==cur.campus)events.push({month:cur.month,type:"캠퍼스이동",icon:"🚚",desc:prev.campus+" → "+cur.campus,color:"#1565C0"});
    if(prev.team!==cur.team&&prev.campus===cur.campus)events.push({month:cur.month,type:"팀이동",icon:"🔀",desc:prev.team+" → "+cur.team,color:"#00838F"});
    if(prev.grade!==cur.grade){
      var isPromo=gradeOrderIdx(cur.grade)<gradeOrderIdx(prev.grade);
      events.push({month:cur.month,type:isPromo?"승진":"직책변경",icon:isPromo?"⬆️":"🔄",desc:prev.grade+" → "+cur.grade,color:isPromo?"#6A1B9A":"#757575"});
    }
    if(prev.basePay&&cur.basePay){
      var diff=(cur.basePay-prev.basePay)/prev.basePay;
      if(Math.abs(diff)>=0.03)events.push({month:cur.month,type:diff>0?"급여인상":"급여삭감",icon:diff>0?"💰":"📉",desc:fmtW(prev.basePay)+" → "+fmtW(cur.basePay)+" ("+(diff>0?"+":"")+(Math.round(diff*1000)/10)+"%)",color:diff>0?"#F57F17":"#C62828"});
    }
  }
  return events.reverse();
}

// 캠퍼스/직책 연속 기간 (Gantt 스타일)
function getPeriodRanges(timeline,field){
  if(!timeline.length)return[];
  // 월별로 값 그룹화 — 전배 월(같은 달에 값 2개)은 이전 값 구간을 그 달까지 연장 후 새 값 구간 시작
  // (행 순서에 따라 "대전→광명→대전→광명"으로 쪼개지던 문제 방지)
  var monthOrder=[];var byMonth={};
  timeline.forEach(function(e){
    var m=e.month;
    if(!byMonth[m]){byMonth[m]=[];monthOrder.push(m);}
    var v=e[field];
    if(byMonth[m].indexOf(v)<0)byMonth[m].push(v);
  });
  var ranges=[];var cur=null;
  monthOrder.forEach(function(m){
    var vals=byMonth[m];
    if(!cur){
      cur={val:vals[0],start:m,end:m};
      vals.slice(1).forEach(function(v){ranges.push(cur);cur={val:v,start:m,end:m};});
      return;
    }
    if(vals.indexOf(cur.val)>=0){
      // 이전 값이 이 달에도 있음 → 구간 연장, 새 값들은 이 달부터 새 구간
      cur.end=m;
      vals.filter(function(v){return v!==cur.val;}).forEach(function(v){ranges.push(cur);cur={val:v,start:m,end:m};});
    }else{
      vals.forEach(function(v){
        if(cur.val===v){cur.end=m;return;}
        ranges.push(cur);cur={val:v,start:m,end:m};
      });
    }
  });
  if(cur)ranges.push(cur);
  return ranges;
}

function monthsBetween(start,end){

// SVG 라인차트 (시계열용)
// series: [{label, color, points:[{x:라벨, y:값}]}] — 여러 선 가능
function svgLine(series,w,h,opts){
  w=w||720;h=h||200;opts=opts||{};
  if(!series.length||!series[0].points.length)return'<svg width="'+w+'" height="'+h+'"></svg>';
  var padL=50,padR=12,padT=12,padB=32;
  var labels=series[0].points.map(function(p){return p.x;});
  var allVals=[];series.forEach(function(s){s.points.forEach(function(p){if(p.y!==null&&p.y!==undefined)allVals.push(p.y);});});
  if(!allVals.length)return'<svg width="'+w+'" height="'+h+'"></svg>';
  var maxY=Math.max.apply(null,allVals);
  var minY=opts.startAtZero!==false?0:Math.min.apply(null,allVals);
  if(maxY===minY)maxY=minY+1;
  var plotW=w-padL-padR,plotH=h-padT-padB;
  var xStep=labels.length>1?plotW/(labels.length-1):0;
  function sx(i){return padL+xStep*i;}
  function sy(v){return padT+plotH-((v-minY)/(maxY-minY))*plotH;}
  var s='<svg width="'+w+'" height="'+h+'" style="overflow:visible;font-family:inherit">';
  // y축 그리드 5단계
  for(var gi=0;gi<=4;gi++){
    var gy=padT+plotH*gi/4;
    var gv=Math.round(maxY-(maxY-minY)*gi/4);
    s+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" stroke="#eee" stroke-width="1"/>';
    s+='<text x="'+(padL-6)+'" y="'+(gy+3)+'" text-anchor="end" font-size="9" fill="#999">'+(opts.yFmt?opts.yFmt(gv):gv)+'</text>';
  }
  // x축 라벨

// SVG 그룹 바 차트 (입사/퇴사 같이)
// data: [{lbl, v1, v2}], c1/c2: 색상, l1/l2: 범례
function svgGroupedBar(data,c1,c2,l1,l2,w,h){
  w=w||720;h=h||180;if(!data.length)return'<svg width="'+w+'" height="'+h+'"></svg>';
  var padL=36,padR=12,padT=18,padB=36;
  var maxV=Math.max.apply(null,data.map(function(d){return Math.max(d.v1||0,d.v2||0);}));
  if(!maxV)maxV=1;
  var plotW=w-padL-padR,plotH=h-padT-padB;
  var groupW=plotW/data.length;var bw=Math.min(14,(groupW-4)/2);
  var s='<svg width="'+w+'" height="'+h+'" style="overflow:visible;font-family:inherit">';
  // y축 그리드
  for(var gi=0;gi<=4;gi++){
    var gy=padT+plotH*gi/4;
    var gv=Math.round(maxV-maxV*gi/4);
    s+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" stroke="#eee" stroke-width="1"/>';
    s+='<text x="'+(padL-4)+'" y="'+(gy+3)+'" text-anchor="end" font-size="9" fill="#999">'+gv+'</text>';
  }
  data.forEach(function(d,i){
    var cx=padL+groupW*(i+0.5);
    var h1=Math.floor(((d.v1||0)/maxV)*plotH);var h2=Math.floor(((d.v2||0)/maxV)*plotH);
    var x1=cx-bw-2,x2=cx+2;
    s+='<rect x="'+x1+'" y="'+(padT+plotH-h1)+'" width="'+bw+'" height="'+h1+'" fill="'+c1+'" rx="2"><title>'+esc(d.lbl)+' '+l1+': '+(d.v1||0)+'</title></rect>';
    s+='<rect x="'+x2+'" y="'+(padT+plotH-h2)+'" width="'+bw+'" height="'+h2+'" fill="'+c2+'" rx="2"><title>'+esc(d.lbl)+' '+l2+': '+(d.v2||0)+'</title></rect>';
    if(d.v1)s+='<text x="'+(x1+bw/2)+'" y="'+(padT+plotH-h1-2)+'" text-anchor="middle" font-size="8" fill="#555">'+d.v1+'</text>';
    if(d.v2)s+='<text x="'+(x2+bw/2)+'" y="'+(padT+plotH-h2-2)+'" text-anchor="middle" font-size="8" fill="#555">'+d.v2+'</text>';
    s+='<text x="'+cx+'" y="'+(h-padB+14)+'" text-anchor="middle" font-size="9" fill="#888">'+esc(String(d.lbl))+'</text>';
  });
  // 범례
  s+='<rect x="'+padL+'" y="6" width="10" height="3" fill="'+c1+'"/><text x="'+(padL+14)+'" y="10" font-size="9" fill="#555">'+l1+'</text>';
  s+='<rect x="'+(padL+60)+'" y="6" width="10" height="3" fill="'+c2+'"/><text x="'+(padL+74)+'" y="10" font-size="9" fill="#555">'+l2+'</text>';
  s+='</svg>';return s;
}

// SVG 히스토그램 (분포)
// bins: [{lbl, v}]
function svgHistogram(bins,color,w,h){
  w=w||680;h=h||140;if(!bins.length)return'<svg width="'+w+'" height="'+h+'"></svg>';
  var padL=30,padR=10,padT=10,padB=28;
  var maxV=Math.max.apply(null,bins.map(function(b){return b.v||0;}));if(!maxV)maxV=1;
  var plotW=w-padL-padR,plotH=h-padT-padB;
  var bw=plotW/bins.length;
  var s='<svg width="'+w+'" height="'+h+'" style="font-family:inherit">';
  for(var gi=0;gi<=4;gi++){
    var gy=padT+plotH*gi/4;

    s+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" stroke="#f0f0f0"/>';
    s+='<text x="'+(padL-4)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="#999">'+gv+'</text>';
  }
  bins.forEach(function(b,i){

    s+='<rect x="'+x+'" y="'+y+'" width="'+(bw-2)+'" height="'+bh+'" fill="'+(color||"#1565C0")+'" opacity=".85"><title>'+esc(b.lbl)+': '+b.v+'명</title></rect>';

// SVG 가로 막대
function svgHBar(items,maxV,color,hPx){

// SVG 도넛 차트
function svgDonut(segments,r,cx,cy){
  r=r||60;cx=cx||70;cy=cy||70;
  var total=segments.reduce(function(a,s){return a+s.v;},0);if(!total)return'<svg width="'+(cx*2)+'" height="'+(cy*2)+'"></svg>';
  var s='<svg width="'+(cx*2)+'" height="'+(cy*2)+'">';
  var start=-Math.PI/2,ri=r*0.55;
  segments.forEach(function(seg){
    var a=(seg.v/total)*2*Math.PI;
    var x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start);
    var x2=cx+r*Math.cos(start+a),y2=cy+r*Math.sin(start+a);
    var xi1=cx+ri*Math.cos(start),yi1=cy+ri*Math.sin(start);
    var xi2=cx+ri*Math.cos(start+a),yi2=cy+ri*Math.sin(start+a);
    var lg=a>Math.PI?1:0;
    s+='<path d="M'+xi1+','+yi1+' L'+x1+','+y1+' A'+r+','+r+' 0 '+lg+',1 '+x2+','+y2+' L'+xi2+','+yi2+' A'+ri+','+ri+' 0 '+lg+',0 '+xi1+','+yi1+' Z" fill="'+seg.c+'" opacity=".85"><title>'+esc(seg.lbl)+': '+seg.v+'명 ('+Math.round(seg.v/total*100)+'%)</title></path>';
    start+=a;
  });
  s+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#1a3a5c">'+total+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="9" fill="#888">명</text>';
  s+='</svg>';return s;
}

// 고용형태 분리 뷰 (현황 탭으로 이동)
function renderGubnSplit(emps,selCp){
  var h='<div style="background:#fff;border:1px solid #e0e0e0;border-top:3px solid #1565C0;border-radius:10px;padding:12px 14px;margin-top:10px;margin-bottom:10px">';

    var cat=getGubnCategory(e.gubn);
    if(!gubnMap[cat])gubnMap[cat]={cnt:0,totalBase:0,totalNet:0};
    gubnMap[cat].cnt++;gubnMap[cat].totalBase+=e.basePay||0;gubnMap[cat].totalNet+=e.netPay||0;
  });
  var gubnArr=Object.keys(gubnMap).map(function(k){return Object.assign({cat:k},gubnMap[k]);}).sort(function(a,b){return b.cnt-a.cnt;});

  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px">';
  gubnArr.forEach(function(g){
    var colors={"정규직":"#1565C0","원어민":"#00838F","비정규직":"#F57F17","파트타임":"#6A1B9A","기타":"#9E9E9E"};
    var c=colors[g.cat]||"#9E9E9E";
    var pct=Math.round(g.cnt/emps.length*1000)/10;
    var avgBase=g.cnt?Math.round(g.totalBase/g.cnt):0;
    h+='<div style="background:'+c+'11;border:1px solid '+c+'55;border-left:4px solid '+c+';border-radius:8px;padding:10px 12px">';
    h+='<div style="font-size:11px;font-weight:800;color:'+c+'">'+esc(g.cat)+'</div>';
    h+='<div style="font-size:18px;font-weight:900;color:'+c+'">'+g.cnt+'<span style="font-size:11px">명</span> <span style="font-size:10px;color:#888;font-weight:400">('+pct+'%)</span></div>';
    h+='<div style="font-size:10px;color:#555;margin-top:3px">평균 기본월급여 <b>'+fmtW(avgBase)+'</b></div>';
    h+='<div style="font-size:10px;color:#555">총 실지급 <b>'+fmtW(g.totalNet)+'</b></div>';

  });
  h+='</div></div>';
  return h;
}

// (37) 여러 월 동시 비교
function renderMultiMonthCompare(selCp){
  var months=Object.keys(MONTHS_DATA).sort(monthCompare);
  // 현재 선택된 월 이후 월은 비교 후보에서 제외
  var curIdxAll=months.indexOf(curMonth);
  if(curIdxAll>=0)months=months.slice(0,curIdxAll+1);
  if(months.length<2)return"";
  // 기본: 최근 3개월 자동 선택 (또는 state.multiMonths)
  if(!state.multiMonths||state.multiMonths.length===0){
    state.multiMonths=months.slice(-3);
  }
  // 선택된 월 중 현재월 이후 것은 제외 (정합성 유지)
  var sel=state.multiMonths.filter(function(m){return months.indexOf(m)>=0;});

  var h='<div style="background:#fff;border:1px solid #e0e0e0;border-top:3px solid #6A1B9A;border-radius:10px;padding:12px 14px;margin:18px 0">';
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">';
  h+='<span style="font-size:11px;font-weight:800;color:#4527A0">🔀 여러 월 동시 비교</span>';
  h+='<span style="font-size:9px;color:#888">연도별로 월(동그라미)을 클릭해 선택/해제 · 최대 6개</span>';
  h+='</div>';
  // 연도별 줄 + 1~12월 동그라미 (데이터 있는 달만 활성) — 월이 늘어도 연도 한 줄씩 추가되고 높이 제한 스크롤
  var byYearM={};
  months.forEach(function(mk){var mt=mk.match(/(\d{4})년\s*(\d+)월/);if(mt)(byYearM[mt[1]]=byYearM[mt[1]]||{})[parseInt(mt[2],10)]=mk;});
  var yrsM=Object.keys(byYearM).sort().reverse();
  h+='<div style="max-height:122px;overflow-y:auto;border:1px solid #f0eef6;border-radius:8px;background:#FCFBFE;padding:5px 8px;margin-bottom:10px">';
  yrsM.forEach(function(y){
    h+='<div style="display:flex;align-items:center;gap:7px;margin:3px 0">';
    h+='<span style="font-size:10px;font-weight:800;color:#4527A0;width:42px;flex-shrink:0">'+y+'년</span>';
    h+='<div style="display:flex;gap:3px;flex-wrap:wrap">';
    for(var mo=1;mo<=12;mo++){
      var mk=byYearM[y][mo];
      if(!mk){h+='<span style="display:inline-flex;align-items:center;justify-content:center;width:25px;height:24px;border-radius:50%;font-size:10px;color:#d7d7de;border:1px solid #f1f1f6">'+mo+'</span>';continue;}
      var isSel=sel.indexOf(mk)>=0;
      h+='<span onclick="toggleMultiMonth(\''+esc(mk)+'\')" title="'+esc(mk)+'" style="display:inline-flex;align-items:center;justify-content:center;width:25px;height:24px;border-radius:50%;font-size:10px;font-weight:700;cursor:pointer;border:1.5px solid '+(isSel?"#4527A0":"#cbb8e6")+';background:'+(isSel?"#4527A0":"#fff")+';color:'+(isSel?"#fff":"#6A4BA0")+'">'+mo+'</span>';
    }
    h+='</div></div>';
  });
  h+='</div>';
  if(sel.length<2){h+='<div style="font-size:11px;color:#aaa;padding:12px;text-align:center">월을 2개 이상 선택하세요</div></div>';return h;}
  // 비교 테이블
  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">';
  h+='<thead><tr style="background:#f5f5f5"><th style="padding:6px 10px;text-align:left;color:#666">지표</th>';
  sel.forEach(function(m){h+='<th style="padding:6px 10px;text-align:right;color:#666">'+esc(m)+'</th>';});
  h+='</tr></thead><tbody>';
  // 각 지표별 행
  var metrics=[
    {lbl:"재직 인원",fn:function(e){return e.length;},fmt:function(v){return v+"명";}},
    {lbl:"기본월급여 총액",fn:function(e){return e.reduce(function(a,x){return a+(x.basePay||0);},0);},fmt:fmtW},
    {lbl:"실지급 총액",fn:function(e){return e.reduce(function(a,x){return a+(x.netPay||0);},0);},fmt:fmtW},
    {lbl:"1인당 평균 기본월급여",fn:function(e){var sum=e.reduce(function(a,x){return a+(x.basePay||0);},0);return e.length?Math.round(sum/e.length):0;},fmt:fmtW},
    {lbl:"1인당 평균 실지급",fn:function(e){var sum=e.reduce(function(a,x){return a+(x.netPay||0);},0);return e.length?Math.round(sum/e.length):0;},fmt:fmtW},
    {lbl:"관리자 인원",fn:function(e){return e.filter(function(x){return isManagerGrade(x.grade);}).length;},fmt:function(v){return v+"명";}}
  ];
  var monthEmps={};sel.forEach(function(m){monthEmps[m]=getEmpsForMonth(m,selCp);});
  metrics.forEach(function(mt,mi){
    h+='<tr style="border-bottom:1px solid #f8f8f8;background:'+(mi%2?"#fafafa":"#fff")+'">';
    h+='<td style="padding:5px 10px;font-weight:700;color:#1a3a5c">'+mt.lbl+'</td>';
    var values=sel.map(function(m){return mt.fn(monthEmps[m]);});
    var maxV=Math.max.apply(null,values);
    sel.forEach(function(m,i){
      var v=values[i];
      var isMax=v===maxV&&values.length>1&&maxV>0;
      h+='<td style="padding:5px 10px;text-align:right;font-weight:700;'+(isMax?"background:#FFF9C4":"")+'">'+mt.fmt(v)+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div style="font-size:9px;color:#aaa;margin-top:6px">※ 최댓값은 노란색 하이라이트</div>';
  h+='</div>';
  return h;
}

function toggleMultiMonth(m){
  if(!state.multiMonths)state.multiMonths=[];
  var idx=state.multiMonths.indexOf(m);
  if(idx>=0)state.multiMonths.splice(idx,1);
  else{
    if(state.multiMonths.length>=6){notify("최대 6개까지","info");return;}
    state.multiMonths.push(m);
    state.multiMonths.sort(monthCompare);
  }
  render();
}

    nationalities:(document.getElementById("af_nat").value||"").split(",").map(function(s){return s.trim();}).filter(Boolean),
    gubn:(document.getElementById("af_gubn").value||"").trim()
  };
}

function matchAdvFilter(emp,af){
  if(af.name&&emp.name.indexOf(af.name)<0)return false;
  if(af.campuses&&af.campuses.length&&af.campuses.indexOf(emp.campus)<0)return false;
  if(af.grades&&af.grades.length&&af.grades.indexOf(emp.grade)<0)return false;
  if(af.baseMin&&(emp.basePay||0)<af.baseMin)return false;
  if(af.baseMax&&(emp.basePay||0)>af.baseMax)return false;
  if(af.tenMin||af.tenMax){
    var rr=(D().rawRecords||[]).find(function(r){return r.name===emp.name;});
    var t=calcTenureDecimal(getEmpFirstJoinDate(emp.name,(rr&&rr.firstJoin)||emp.joinDate));
    if(t===null)return false;
    if(af.tenMin&&t<af.tenMin)return false;
    if(af.tenMax&&t>af.tenMax)return false;
  }
  if(af.nationalities&&af.nationalities.length){
    var n=emp.nationality||"";var rr2=(D().rawRecords||[]).find(function(r){return r.name===emp.name;});if(rr2)n=n||rr2.nationality||"";
    if(af.nationalities.indexOf(n)<0)return false;
  }
  if(af.gubn&&String(emp.gubn||"").indexOf(af.gubn)<0)return false;
  return true;
}

function previewAdvSearch(){
  var af=collectAdvFilter();
  var matched=getAllEmployees().filter(function(e){return matchAdvFilter(e,af);});
  document.getElementById("afResult").innerHTML='<b>매치: '+matched.length+'명</b> '+(matched.length?'— '+matched.slice(0,5).map(function(e){return esc(e.name);}).join(", ")+(matched.length>5?", ...":""):"");
}

function applyAdvSearch(){

  // 일반 검색은 클리어 (고급검색만 적용)
